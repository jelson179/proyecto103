<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal de Juegos</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .pantalla{
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    .titulo{
      font-size: 3rem;
      font-weight: bold;
      color: #0d6efd;
      margin-bottom: 30px;
    }

    .btn-juego{
      width: 100%;
      margin-bottom: 15px;
      padding: 15px;
      font-size: 1.1rem;
      border-radius: 12px;
    }

    #menuJuegos{
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla Principal -->
  <div class="pantalla" id="inicio">

    <h1 class="titulo">Bienvenido</h1>

    <p class="mb-4">
      Portal de Juegos
    </p>

    <button class="btn btn-primary btn-lg px-5" onclick="entrar()">
      Entrar
    </button>

  </div>

  <!-- Menú de Juegos -->
  <div class="pantalla" id="menuJuegos">

    <h1 class="titulo">Juegos</h1>

    <!-- BOTONES CONECTADOS A OTROS ARCHIVOS -->

    <a href="sopa.html" class="btn btn-success btn-juego">
      Sopa de Letras
    </a>

    <a href="crucigrama.html" class="btn btn-warning btn-juego">
      Crucigrama
    </a>

    <a href="cuestionario.html" class="btn btn-info btn-juego text-white">
      Cuestionario
    </a>

    <a href="pacman.html" class="btn btn-dark btn-juego">
      Pacman
    </a>

    <a href="sudoku.html" class="btn btn-danger btn-juego">
      Sudoku
    </a>

  </div>

  <script>

    function entrar() {

      document.getElementById("inicio").style.display = "none";

      document.getElementById("menuJuegos").style.display = "block";

    }

  </script>

</body>
</html>
