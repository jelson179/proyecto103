<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sopa de Letras Interactiva - Fútbol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .grid { display: grid; grid-template-columns: repeat(12, 40px); gap: 5px; justify-content: center; }
    .cell { width: 40px; height: 40px; display:flex; align-items:center; justify-content:center; border:1px solid #333; font-weight:bold; cursor:pointer; user-select:none; }
    .selected { background-color: #0d6efd; color: white; }
    .found { background-color: #198754 !important; color: white; }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="text-center mb-4">
    <h1 class="fw-bold">⚽ Sopa de Letras - Fútbol</h1>
    <p class="text-muted">Selecciona palabras en línea recta (horizontal o vertical)</p>
  </div>

  <div id="grid" class="grid mb-4"></div>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Palabras</h5>
      <ul id="wordList" class="list-group list-group-flush"></ul>
    </div>
  </div>
</div>

<script>
const size = 12;
const words = ["GOL","BALON","EQUIPO","ARBITRO","PORTERO","DEFENSA","ATAQUE","PASE","TIRO","CANCHA"];

let gridData = Array.from({length: size}, () => Array(size).fill(""));
let wordPositions = {};
let foundCount = 0;

function placeWord(word) {
  let placed = false;

  while (!placed) {
    const dir = Math.random() > 0.5 ? "H" : "V";
    const row = Math.floor(Math.random() * size);
    const col = Math.floor(Math.random() * size);

    if (dir === "H" && col + word.length <= size) {
      let fits = true;
      for (let i = 0; i < word.length; i++) {
        if (gridData[row][col + i] && gridData[row][col + i] !== word[i]) fits = false;
      }
      if (fits) {
        wordPositions[word] = [];
        for (let i = 0; i < word.length; i++) {
          gridData[row][col + i] = word[i];
          wordPositions[word].push(`${row}-${col+i}`);
        }
        placed = true;
      }
    }

    if (dir === "V" && row + word.length <= size) {
      let fits = true;
      for (let i = 0; i < word.length; i++) {
        if (gridData[row + i][col] && gridData[row + i][col] !== word[i]) fits = false;
      }
      if (fits) {
        wordPositions[word] = [];
        for (let i = 0; i < word.length; i++) {
          gridData[row + i][col] = word[i];
          wordPositions[word].push(`${row+i}-${col}`);
        }
        placed = true;
      }
    }
  }
}

words.forEach(placeWord);

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for (let r = 0; r < size; r++) {
  for (let c = 0; c < size; c++) {
    if (!gridData[r][c]) {
      gridData[r][c] = letters[Math.floor(Math.random() * letters.length)];
    }
  }
}

const grid = document.getElementById("grid");
const wordList = document.getElementById("wordList");
let selectedCells = [];
const cells = {};

words.forEach(word => {
  const li = document.createElement("li");
  li.className = "list-group-item";
  li.textContent = word;
  li.id = "word-" + word;
  wordList.appendChild(li);
});

gridData.forEach((row, r) => {
  row.forEach((letter, c) => {
    const div = document.createElement("div");
    div.className = "cell";
    div.textContent = letter;
    div.dataset.key = `${r}-${c}`;

    div.addEventListener("click", () => handleClick(div));

    grid.appendChild(div);
    cells[`${r}-${c}`] = div;
  });
});

function handleClick(cell) {
  if (cell.classList.contains("found")) return;

  const key = cell.dataset.key;

  if (selectedCells.includes(key)) {
    selectedCells = selectedCells.filter(k => k !== key);
    cell.classList.remove("selected");
  } else {
    selectedCells.push(key);
    cell.classList.add("selected");
  }

  checkWord();
}

function isStraightLine(keys) {
  const rows = keys.map(k => parseInt(k.split("-")[0]));
  const cols = keys.map(k => parseInt(k.split("-")[1]));

  const sameRow = rows.every(r => r === rows[0]);
  const sameCol = cols.every(c => c === cols[0]);

  return sameRow || sameCol;
}

function checkWord() {
  if (!isStraightLine(selectedCells)) return;

  const sorted = [...selectedCells].sort();

  for (let word in wordPositions) {
    const target = [...wordPositions[word]].sort();

    if (JSON.stringify(sorted) === JSON.stringify(target)) {
      target.forEach(k => {
        cells[k].classList.remove("selected");
        cells[k].classList.add("found");
      });

      const item = document.getElementById("word-" + word);
      if (item) item.remove();

      selectedCells = [];
      foundCount++;

      if (foundCount === words.length) {
        Swal.fire({
          title: '¡Muy bien!',
          icon: 'success',
          timer: 2000,
          showConfirmButton: false,
          background: '#198754',
          color: '#fff'
        });
      }

      return;
    }
  }
}
</script>

</body>
</html>
