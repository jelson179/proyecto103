<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuestionario de Fútbol</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: #eef2f7;
}
.card {
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">⚽ Cuestionario de Fútbol</h2>

        <form id="quizForm">

            <!-- Pregunta 1 -->
            <div class="mb-3">
                <label><b>1. ¿Cuántos jugadores hay en el campo por equipo?</b></label><br>
                <input type="radio" name="q1" value="a"> 9<br>
                <input type="radio" name="q1" value="b"> 10<br>
                <input type="radio" name="q1" value="c"> 11<br>
            </div>

            <!-- Pregunta 2 -->
            <div class="mb-3">
                <label><b>2. ¿Cada cuánto se juega el Mundial?</b></label><br>
                <input type="radio" name="q2" value="a"> 2 años<br>
                <input type="radio" name="q2" value="b"> 4 años<br>
                <input type="radio" name="q2" value="c"> 6 años<br>
            </div>

            <!-- Pregunta 3 -->
            <div class="mb-3">
                <label><b>3. ¿Quién ganó el Mundial 2018?</b></label><br>
                <input type="radio" name="q3" value="a"> Francia<br>
                <input type="radio" name="q3" value="b"> Croacia<br>
                <input type="radio" name="q3" value="c"> Brasil<br>
            </div>

            <!-- Pregunta 4 -->
            <div class="mb-3">
                <label><b>4. ¿Cuánto dura un partido?</b></label><br>
                <input type="radio" name="q4" value="a"> 90 minutos<br>
                <input type="radio" name="q4" value="b"> 70 minutos<br>
                <input type="radio" name="q4" value="c"> 100 minutos<br>
            </div>

            <!-- Pregunta 5 -->
            <div class="mb-3">
                <label><b>5. ¿Qué jugador es conocido como "El Bicho"?</b></label><br>
                <input type="radio" name="q5" value="a"> Messi<br>
                <input type="radio" name="q5" value="b"> Cristiano Ronaldo<br>
                <input type="radio" name="q5" value="c"> Mbappé<br>
            </div>

            <!-- Pregunta 6 -->
            <div class="mb-3">
                <label><b>6. ¿Qué país ha ganado más Mundiales?</b></label><br>
                <input type="radio" name="q6" value="a"> Brasil<br>
                <input type="radio" name="q6" value="b"> Alemania<br>
                <input type="radio" name="q6" value="c"> Italia<br>
            </div>

            <!-- Pregunta 7 -->
            <div class="mb-3">
                <label><b>7. ¿Cómo se llama el torneo más importante de clubes en Europa?</b></label><br>
                <input type="radio" name="q7" value="a"> Europa League<br>
                <input type="radio" name="q7" value="b"> Champions League<br>
                <input type="radio" name="q7" value="c"> Copa Libertadores<br>
            </div>

            <!-- Pregunta 8 -->
            <div class="mb-3">
                <label><b>8. ¿Qué selección ganó el Mundial 2022?</b></label><br>
                <input type="radio" name="q8" value="a"> Francia<br>
                <input type="radio" name="q8" value="b"> Argentina<br>
                <input type="radio" name="q8" value="c"> Brasil<br>
            </div>

            <button type="button" class="btn btn-success w-100 mt-3" onclick="finalizarQuiz()">Finalizar</button>

        </form>
    </div>
</div>

<script>
function finalizarQuiz() {
    let respuestas = {
        q1: "c",
        q2: "b",
        q3: "a",
        q4: "a",
        q5: "b",
        q6: "a",
        q7: "b",
        q8: "b"
    };

    let puntaje = 0;

    for (let pregunta in respuestas) {
        let seleccion = document.querySelector('input[name="' + pregunta + '"]:checked');
        if (seleccion && seleccion.value === respuestas[pregunta]) {
            puntaje++;
        }
    }

    Swal.fire({
        title: 'Muy bien',
        text: 'Tu puntaje es: ' + puntaje + ' de 8',
        icon: 'success',
        confirmButtonColor: '#28a745'
    });
}
</script>

</body>
</html>
